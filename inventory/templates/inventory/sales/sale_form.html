<!DOCTYPE html>
<html>
<head>
    <title>Sale Form</title>
</head>
<body>

<h2>{% if object %}Update Sale{% else %}Create Sale{% endif %}</h2>

    {{ form.as_p }}

</form>

<br>

<a href="{% url 'sale_list' %}">Back to Sales</a>

</body>
</html>
