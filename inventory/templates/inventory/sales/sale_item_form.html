{% extends "inventory/base.html" %}
{% block title %}{% if object %}Update{% else %}Add{% endif %} Sale Item{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card form-card">
            <div class="card-body">
                <h4>{% if object %}✏️ Update Sale Item{% else %}➕ Add Sale Item{% endif %}</h4>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'sale_item_list' %}" class="btn btn-outline-secondary">← Back</a>
                        <button type="submit" class="btn btn-primary px-4">Save Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
