{% extends "inventory/base.html" %}
{% block title %}Delete Sale Item{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card delete-card text-center p-4">
            <div class="delete-icon"></div>
            <h4 class="text-danger fw-bold mb-2">Delete Sale Item</h4>
            <p class="text-muted mb-4">Are you sure you want to delete this sale item? Inventory will be restored.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'sale_item_list' %}" class="btn btn-outline-secondary px-4">← Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
