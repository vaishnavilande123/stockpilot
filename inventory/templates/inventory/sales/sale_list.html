<!DOCTYPE html>
<html>
<head>
    <title>Sales</title>
</head>
<body>

<h2>Sales</h2>

<a href="{% url 'sale_add' %}">Create Sale</a>

<br><br>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>ID</th>
            <th>Store</th>
            <th>Sale Date</th>
            <th>Total Amount</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

    {% for sale in sales %}

        <tr>
            <td>{{ sale.id }}</td>
            <td>{{ sale.store }}</td>
            <td>{{ sale.sale_date }}</td>
            <td>{{ sale.total_amount }}</td>

            <td>
                <a href="{% url 'sale_item_list' %}?sale_id={{ sale.id }}">View Items</a> |
                <a href="{% url 'sale_update' sale.id %}">Edit</a> |
                <a href="{% url 'sale_delete' sale.id %}">Delete</a>
            </td>
        </tr>

    {% empty %}

        <tr>
            <td colspan="5">No sales found</td>
        </tr>

    {% endfor %}

    </tbody>

</table>

</body>
</html>
