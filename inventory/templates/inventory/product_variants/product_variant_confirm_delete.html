<!DOCTYPE html>
<html>
<head>
    <title>Delete Variant</title>
</head>
<body>

<h2>Delete Variant</h2>

<p>
Are you sure you want to delete 
<strong>{{ object.product.name }} - {{ object.size }} - {{ object.color }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>

<br>

<a href="{% url 'product_variant_list' %}">Cancel</a>

</body>
</html>
