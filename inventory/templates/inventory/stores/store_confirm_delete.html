{% extends "inventory/base.html" %}
{% block title %}Delete Store{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card delete-card text-center p-4">
            <div class="delete-icon">🗑️</div>
            <h4 class="text-danger fw-bold mb-2">Delete Store</h4>
            <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ object.store_name }}"</strong>? All data associated with this store will be permanently removed.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'select_store' %}" class="btn btn-outline-secondary px-4">← Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
