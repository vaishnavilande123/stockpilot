
<!DOCTYPE html>
<html>
<head>
    <title>Purchases</title>
</head>
<body>

<h2>Purchases</h2>

<a href="{% url 'purchase_add' %}">Create Purchase</a>

<br><br>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>ID</th>
            <th>Supplier</th>
            <th>Order Date</th>
            <th>Status</th>
            <th>Total Cost</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

    {% for purchase in purchases %}

        <tr>
            <td>{{ purchase.id }}</td>
            <td>{{ purchase.supplier }}</td>
            <td>{{ purchase.order_date }}</td>
            <td>{{ purchase.order_status }}</td>
            <td>{{ purchase.total_cost }}</td>

            <td>
                <a href="{% url 'purchase_update' purchase.id %}">Edit</a>
                |
                <a href="{% url 'purchase_delete' purchase.id %}">Delete</a>
                
                <a href="{% url 'purchase_item_list' %}?purchase_id={{ purchase.id }}">View Items</a>
            </td>
        </tr>

    {% empty %}

        <tr>
            <td colspan="6">No purchases found</td>
        </tr>

    {% endfor %}

    </tbody>

</table>

</body>
</html>
