<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

<h1>Product List</h1>

<a href="{% url 'product_add' %}">+ Add Product</a>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Cost Price</th>
        <th>Selling Price</th>
        <th>Edit</th>
        <th>Delete</th>
        <th>Add Variant</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.cost_price }}</td>
        <td>{{ product.selling_price }}</td>

        <td>
            <a href="{% url 'product_update' product.id %}">Edit</a>
        </td>

        <td>
            <a href="{% url 'product_delete' product.id %}">Delete</a>
        </td>

        <td>
            <a href="{% url 'product_variant_add' %}?product_id={{ product.id }}">Add Variant</a>
        </td>
    </tr>

    {% empty %}
    <tr>
        <td colspan="6">No Products Available</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
