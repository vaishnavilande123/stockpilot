{% extends "inventory/base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="text-center bg-white p-5 shadow-sm" style="max-width: 500px; width: 100%; border-radius: 16px;">
        <h1 style="font-size: 6rem; font-weight: 900; color: #4c1d95; line-height: 1;" class="mb-2">404</h1>
        <h3 class="fw-bold mb-3 text-dark">Page Not Found</h3>
        <p class="text-muted mb-4" style="font-size: 1.05rem;">
            Oops! The stock you are looking for seems to be missing from the warehouse. 
            The page you requested could not be found.
        </p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 py-2" style="border-radius: 8px; font-weight: 600;">
            ← Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
